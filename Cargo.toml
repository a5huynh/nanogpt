[workspace]
resolver = "2"
members = [ "crates/nanodiffuse","crates/nanogpt", "crates/nanotok"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.13"
log = "0.4"
pretty_env_logger = "0.5"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"